# Umami for the demo and docs page views: docs/guide/usage-analytics. Self-hosted, cookieless.
# Copy .env.example to .env first. It listens on 127.0.0.1:3005 for a test; in production, route a
# subdomain to it with your reverse proxy, and remove `ports`.
name: 3dtiled-analytics
services:
  umami:
    image: ghcr.io/umami-software/umami:latest
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3005:3000"
    environment:
      DATABASE_URL: postgresql://umami:${POSTGRES_PASSWORD:?set it in .env}@db:5432/umami
      APP_SECRET: ${APP_SECRET:?set it in .env}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY:?set it in .env}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  umami-db-data:
