name: Publish Docker images

# Builds all three images (tile-server, viewer, docs) and pushes them to GHCR on every GitHub
# release, plus a `:main` tag on every push to main so `docker compose pull` always has something
# runnable without needing a tagged release.
on:
  release:
    types: [published]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [tile-server, viewer, docs]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.target }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Only consumed by the `viewer` target's ARG (see Dockerfile) — harmlessly ignored by the
          # other two matrix targets, which never declare that ARG. Bakes the production tile-server's
          # own Traefik-routed domain into the published viewer image's static bundle.
          build-args: |
            VITE_TILE_SERVER_URL=https://3dtiler.prod.heritagewatch.ai
