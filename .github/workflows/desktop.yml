name: Desktop app (Windows)

# Builds the Electrobun desktop companion and publishes it on one rolling GitHub Release, `desktop-latest`,
# replaced on every run. On demand, or by pushing a `desktop-v*` tag. Unsigned. See apps/desktop/README.md.
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    # PowerShell throughout: Hutch shells out to `tar`, and Git Bash's reads a C:\ path as a remote host.
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Hutch
        run: |
          & ([scriptblock]::Create((irm https://hutch.blackboard.sh/hutch/install.ps1)))
          "$env:USERPROFILE\.hutch\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Bundle Node and the tile-server
        run: node apps/desktop/scripts/prepare-bundle.mjs

      # The view (React + Tailwind + shadcn) is built by Vite into dist/, which electrobun.config.ts copies
      # into the app. Its dependencies are pnpm's, with the app's own lockfile: apps/desktop is outside the
      # root workspace, hence --ignore-workspace (hutch.config.ts says why).
      - name: Build
        working-directory: apps/desktop
        run: |
          hutch --version
          hutch install --frozen-lockfile --ignore-workspace
          hutch run typecheck
          hutch run view
          $env:DESKTOP_BUNDLE_MAP = "$PWD\bundle\copy-map.json"
          $now = (Get-Date).ToUniversalTime()
          $env:BUILD_VERSION = "$($now.Year).$($now.Month).$($now.Day)"
          hutch electrobun build --env=stable
          node scripts/package-windows.mjs
          Get-ChildItem artifacts | Select-Object Name, Length

      # What a user does: install, launch. The system Node is hidden, so a pass means the bundled one ran.
      - name: Smoke test the installed app
        working-directory: apps/desktop
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'setup'
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item artifacts/Setup.exe "$dir\3DTiled-Setup.exe"
          $installed = "$env:LOCALAPPDATA\com.iconem.3dtiled.desktop\stable"
          $path = $env:PATH
          $env:PATH = 'C:\Windows\System32;C:\Windows'
          # The installer stays open on its finished screen, so wait for its files rather than its exit.
          $setup = Start-Process "$dir\3DTiled-Setup.exe" -WorkingDirectory $dir -PassThru
          $deadline = (Get-Date).AddMinutes(8)
          while (-not (Test-Path "$installed\uninstall.exe") -and (Get-Date) -lt $deadline) { Start-Sleep 3 }
          if (-not (Test-Path "$installed\uninstall.exe")) { throw 'the installer did not finish' }
          Stop-Process $setup -Force -ErrorAction SilentlyContinue
          $bin = "$installed\app\bin"
          $app = Start-Process "$bin\launcher.exe" -WorkingDirectory $bin -PassThru
          $env:PATH = $path
          $title = $null
          $deadline = (Get-Date).AddMinutes(4)
          while (-not $title -and (Get-Date) -lt $deadline) {
            try { $title = (Invoke-RestMethod http://127.0.0.1:3001/openapi.json -TimeoutSec 3).info.title } catch { Start-Sleep 3 }
          }
          if (-not $title) { throw 'the app did not start its tile-server' }
          $owner = Get-CimInstance Win32_Process -Filter "Name='node.exe'" | Where-Object { $_.CommandLine -match 'tile-server' }
          if ($owner.ExecutablePath -notmatch 'com\.iconem\.3dtiled\.desktop') { throw "tile-server runs from $($owner.ExecutablePath)" }
          # Off the network, or Windows asks a firewall question.
          $ip = (Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.IPAddress -notlike '127.*' -and $_.IPAddress -notlike '169.*' } | Select-Object -First 1).IPAddress
          $open = $false
          try { Invoke-RestMethod "http://${ip}:3001/openapi.json" -TimeoutSec 4 | Out-Null; $open = $true } catch {}
          if ($open) { throw "tile-server answers on $ip" }
          $url = [uri]::EscapeDataString('https://s3.amazonaws.com/hobu-lidar/autzen-classified.copc.laz')
          $tileset = Invoke-RestMethod "http://127.0.0.1:3001/stream/tileset.json?format=copc&url=$url&cache=none" -TimeoutSec 120
          "$title, COPC tileset $($tileset.asset.version), from $($owner.ExecutablePath)"
          Stop-Process $app -Force -ErrorAction SilentlyContinue
          Get-CimInstance Win32_Process -Filter "Name='node.exe'" | Where-Object { $_.ExecutablePath -match 'com\.iconem\.3dtiled\.desktop' } | ForEach-Object { Stop-Process $_.ProcessId -Force }

      - name: Smoke test the portable zip
        working-directory: apps/desktop
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'portable'
          New-Item -ItemType Directory $dir | Out-Null
          C:\Windows\System32\tar.exe -xf artifacts/Portable.zip -C $dir
          $root = (Get-ChildItem $dir)[0].FullName
          $path = $env:PATH
          $env:PATH = 'C:\Windows\System32;C:\Windows'
          $app = Start-Process "$root\bin\launcher.exe" -WorkingDirectory "$root\bin" -PassThru
          $env:PATH = $path
          $title = $null
          $deadline = (Get-Date).AddMinutes(4)
          while (-not $title -and (Get-Date) -lt $deadline) {
            try { $title = (Invoke-RestMethod http://127.0.0.1:3001/openapi.json -TimeoutSec 3).info.title } catch { Start-Sleep 3 }
          }
          if (-not $title) { throw 'the portable app did not start its tile-server' }
          $owner = Get-CimInstance Win32_Process -Filter "Name='node.exe'" | Where-Object { $_.CommandLine -match 'tile-server' }
          if ($owner.ExecutablePath -notlike "$dir*") { throw "tile-server runs from $($owner.ExecutablePath)" }
          "$title, from $($owner.ExecutablePath)"
          Stop-Process $app -Force -ErrorAction SilentlyContinue

      - name: Publish the rolling release
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = (git rev-parse --short HEAD)
          $date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
          $setup = "3DTiled-win-x64-Setup-$date.exe"
          $portable = "3DTiled-win-x64-Portable-$date.zip"
          Copy-Item artifacts/Setup.exe $setup
          Copy-Item artifacts/Portable.zip $portable
          # The two feed files keep their names: an installed app fetches them from this release to update itself.
          $assets = @($setup, $portable, 'artifacts/stable-win-x64-update.json', 'artifacts/stable-win-x64-build.json', 'artifacts/stable-win-x64-3DTiled.tar.zst')
          $notes = "Windows x64 build of $sha, $date. **$setup** installs for your user, with no admin rights, and updates itself. **$portable** runs from any folder after unzipping: start ``3DTiled.cmd``; it does not update itself. Unsigned, so SmartScreen warns on first run (More info, Run anyway). Includes Node and the tile-server; nothing else to install. The other three files are the update feed."
          gh release view desktop-latest *> $null
          if ($LASTEXITCODE -ne 0) { gh release create desktop-latest --title "Desktop app ($date)" --notes $notes --target $env:GITHUB_SHA --latest=false }
          gh release upload desktop-latest @assets --clobber
          $keep = $assets | ForEach-Object { Split-Path $_ -Leaf }
          $old = gh release view desktop-latest --json assets -q '.assets[].name'
          foreach ($name in $old) { if ($keep -notcontains $name) { gh release delete-asset desktop-latest $name --yes } }
          gh release edit desktop-latest --title "Desktop app ($date)" --notes $notes
