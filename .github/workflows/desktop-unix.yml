name: Desktop app (macOS, Linux)

# Builds the Electrobun desktop companion on macOS and Linux, starts it, and keeps what was built as a
# workflow artifact (14 days). On demand only. With `publish` (the default), a platform whose build started
# and served a tileset adds its files to the rolling `desktop-latest` release, beside the Windows ones
# (desktop.yml): every file name starts with its platform, so neither workflow touches the other's files.
# Unsigned. See apps/desktop/README.md.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Add the builds that pass to the desktop-latest release
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon only: Electrobun 2.0.2 has no development kit for Intel Macs (`ElectrobunArtifactPlatformMissing`
          # on macos-15-intel, run of 2026-11-19).
          - { name: macos-arm64, os: macos-15 }
          - { name: linux-x64, os: ubuntu-24.04 }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # What an Electrobun app needs to open a window on Linux (the system webview), and a display for the test.
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1 xvfb

      - name: Install Hutch
        run: |
          curl -fsSL https://hutch.blackboard.sh/hutch/install.sh | sh
          echo "$HOME/.hutch/bin" >> "$GITHUB_PATH"

      - name: Bundle Node and the tile-server
        run: node apps/desktop/scripts/prepare-bundle.mjs

      - name: Build
        working-directory: apps/desktop
        run: |
          hutch --version
          hutch install --frozen-lockfile --ignore-workspace
          hutch run typecheck
          hutch run view
          export DESKTOP_BUNDLE_MAP="$PWD/bundle/copy-map.json"
          export BUILD_VERSION="$(date -u +%Y.%-m.%-d)"
          hutch electrobun build --env=stable
          echo "--- artifacts"; ls -la artifacts || true
          echo "--- build"; find build -maxdepth 3 | head -60

      # What a user does: launch. The system Node is hidden, so a pass means the bundled one ran.
      - name: Smoke test the built app
        working-directory: apps/desktop
        run: |
          launcher="$(find build -type f -name launcher | head -1)"
          if [ -z "$launcher" ]; then echo "no launcher in build/"; find build -maxdepth 6 -type f | head -80; exit 1; fi
          echo "launcher: $launcher"
          node_dir="$(dirname "$(command -v node)")"
          clean_path="$(echo "$PATH" | tr ':' '\n' | grep -v -F "$node_dir" | grep -v -i node | paste -sd: -)"
          # A display that outlives the launcher: on Linux the built launcher installs the app for the user and leaves.
          if [ "$RUNNER_OS" = "Linux" ]; then Xvfb :99 -screen 0 1280x1024x24 > /dev/null 2>&1 & export DISPLAY=:99; sleep 2; fi
          probe() {
            title=""
            for i in $(seq 1 "$1"); do
              title="$(curl -fsS -m 3 http://127.0.0.1:3001/openapi.json 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).info.title)}catch{}})" || true)"
              [ -n "$title" ] && break
              sleep 3
            done
          }
          PATH="$clean_path" "$launcher" > app.log 2>&1 &
          probe 25
          if [ -z "$title" ]; then
            # installed, not started: start what it installed, as its shortcut does
            installed="$(find "$HOME/.local/share/com.iconem.3dtiled.desktop" "$HOME/Library/Application Support/com.iconem.3dtiled.desktop" -type f -name launcher 2>/dev/null | head -1)"
            echo "installed launcher: ${installed:-none}"
            if [ -n "$installed" ]; then
              PATH="$clean_path" "$installed" >> app.log 2>&1 &
              probe 50
            fi
          fi
          echo "--- app log"; tail -80 app.log || true
          if [ -z "$title" ]; then echo "the app did not start its tile-server"; ps -eo pid,args | grep -i -E "3dtiled|launcher|tile-server" | grep -v grep || true; exit 1; fi
          owner="$(ps -eo args | grep "tile-server" | grep -v grep | head -1)"
          echo "$title, served by: $owner"
          case "$owner" in *"3dtiled/runtime/node"*) ;; *) echo "the tile-server does not run on the bundled Node"; exit 1 ;; esac
          url="https%3A%2F%2Fs3.amazonaws.com%2Fhobu-lidar%2Fautzen-classified.copc.laz"
          curl -fsS -m 120 "http://127.0.0.1:3001/stream/tileset.json?format=copc&url=$url&cache=none" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log('COPC tileset', JSON.parse(s).asset.version))"
          pkill -f launcher || true
          pkill -f tile-server || true

      - name: Pack what was built
        if: always()
        working-directory: apps/desktop
        run: |
          mkdir -p out
          # What Electrobun packed for distribution; without it, the built folder (tar keeps the executable bits
          # and the .app layout that the artifact's own zip would lose).
          if [ -d artifacts ] && [ -n "$(ls -A artifacts 2>/dev/null)" ]; then cp -R artifacts/. out/
          else
            app="$(find build -maxdepth 3 \( -name '*.app' -o -name '3DTiled*' \) -type d | head -1)"
            if [ -n "$app" ]; then tar -czf "out/3DTiled-${{ matrix.name }}.tar.gz" -C "$(dirname "$app")" "$(basename "$app")"; fi
          fi
          [ -f app.log ] && cp app.log out/ || true
          ls -la out

      # Only what passed the smoke test above, and only files named after this platform: the Windows files
      # of the same release (installer, portable zip, update feed) are never touched.
      - name: Add to the rolling release
        if: success() && inputs.publish
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view desktop-latest > /dev/null 2>&1; then echo "no desktop-latest release yet: run desktop.yml first"; exit 0; fi
          files=""
          for f in artifacts/*; do
            case "$(basename "$f")" in
              *win-*) echo "skipped (a Windows name): $f" ;;
              *linux-*|*macos-*|*darwin-*|*mac-*) files="$files $f" ;;
              *) echo "skipped (no platform in its name): $f" ;;
            esac
          done
          if [ -z "$files" ]; then echo "nothing to publish"; ls -la artifacts || true; exit 0; fi
          echo "publishing:$files"
          gh release upload desktop-latest $files --clobber

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 3DTiled-${{ matrix.name }}
          path: apps/desktop/out
          retention-days: 14
          if-no-files-found: warn
