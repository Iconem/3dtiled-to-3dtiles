name: 3dtiled
services:
  tile-server:
    container_name: 3dtiled-tile-server
    build:
      context: .
      target: tile-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    # Child roots and snap offsets, kept across restarts and new images: the first snapped mosaic is slow.
    environment:
      - AGGREGATE_CACHE_DIR=/cache
    volumes:
      - tile-cache:/cache

  viewer:
    container_name: 3dtiled-viewer
    build:
      context: .
      target: viewer
    restart: unless-stopped
    depends_on:
      - tile-server
    ports:
      - "3000:3000"
    # Optional keys for Google 3D and Cesium World Terrain, written to env-config.js at container start.
    environment:
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      - CESIUM_ION_TOKEN=${CESIUM_ION_TOKEN:-}
      # Optional page-view counting, see deploy/analytics.
      - UMAMI_SRC=${UMAMI_SRC:-}
      - UMAMI_WEBSITE_ID=${UMAMI_WEBSITE_ID:-}
    # Optional: drop your own datasets in ./sample-data on the host to reach them from the viewer's
    # format pills (they build /sample-data/... URLs) — the image ships with none (gitignored, local-only).
    volumes:
      - ./sample-data:/app/dist/sample-data:ro

  docs:
    container_name: 3dtiled-docs
    build:
      context: .
      target: docs
    restart: unless-stopped
    ports:
      - "3002:3002"
    # Note: static files built by Next.js, served on their own port. If
    # you're putting a reverse proxy in front of all three (Traefik, Caddy, nginx...), route
    # `/docs` + `/_next` + `/api/search` + `/og` + `/llms*` at this service's :3002 and everything
    # else at viewer's :3000, matching what apps/viewer/vite.config.ts's dev-only proxy already does.

volumes:
  tile-cache:
