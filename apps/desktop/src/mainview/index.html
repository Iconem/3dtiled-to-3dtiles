<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Tiled — local middleware</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='14 14 92 92' fill='none'%3E%3Crect x='20' y='20' width='80' height='80' stroke='%2322c55e' stroke-width='5' stroke-linejoin='round'/%3E%3Cpath d='M60 20V100M20 60H100M80 60V100M60 80H100' stroke='%2322c55e' stroke-width='5' stroke-linecap='round'/%3E%3Crect x='80' y='80' width='20' height='20' fill='%2322c55e'/%3E%3C/svg%3E">
    <script>
        // Before the first paint, so a light window does not flash dark. theme.ts keeps it up to date.
        (function () {
            var c = localStorage.getItem('3dtiled-desktop-theme');
            var light = c === 'light' || (c !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches);
            document.documentElement.dataset.theme = light ? 'light' : 'dark';
        })();
    </script>
</head>
<body>
    <div id="root"></div>
    <!-- Vite rewrites this to the hashed bundle under assets/ and injects the stylesheet. -->
    <script type="module" src="./main.tsx"></script>
</body>
</html>
