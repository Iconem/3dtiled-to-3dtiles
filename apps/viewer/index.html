<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="deploy-check" content="2026-11-03" />
    <title>3D Tiled</title>
    <script>
      // Applied synchronously, before first paint, so switching themes doesn't flash the wrong one
      // on reload — React only reads/writes this same localStorage key afterwards (state/store.ts).
      (function () {
        var theme = localStorage.getItem('3d-tiled-theme') || 'dark';
        if (theme === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Runtime-overridable tile-server URL — see public/env-config.js and docker-entrypoint.sh.
         A plain (non-module) script tag so it runs synchronously, before the deferred module
         script below, guaranteeing window.__TILE_SERVER_URL__ is set before formats.ts reads it. -->
    <script src="/env-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
