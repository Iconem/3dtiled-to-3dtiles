<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Tiled</title>
    <script>
      // Applied synchronously, before first paint, so switching themes doesn't flash the wrong one
      // on reload — React only reads/writes this same localStorage key afterwards (state/store.ts).
      (function () {
        var theme = localStorage.getItem('3d-tiled-theme') || 'dark';
        if (theme === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
