[package]
name = "spark-rad-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Spark's own RAD decoder (rust/spark-lib, feature `rad`) as a WebAssembly module for Node: one RAD chunk in, its splat columns out."

[lib]
crate-type = ["cdylib"]

[dependencies]
# Spark's library, pinned: the RAD format is whatever this commit reads. MIT, World Labs Technologies.
spark-lib = { git = "https://github.com/sparkjsdev/spark", rev = "ffe210dc0a45d0515a06c9235878108112827d61", default-features = false, features = ["rad", "gsplat"] }
anyhow = "1"
serde_json = "1"
wasm-bindgen = "0.2.100"
js-sys = "0.3.77"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
